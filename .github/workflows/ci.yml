name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend build & test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: studentconnect_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore StudentConnect.slnx
        working-directory: backend

      - name: Build
        run: dotnet build StudentConnect.slnx --no-restore --configuration Release
        working-directory: backend

      - name: Test
        env:
          STUDENTCONNECT_TEST_CONNECTION_STRING: "Host=localhost;Port=5432;Database=studentconnect_test_db;Username=postgres;Password=postgres;SSL Mode=Disable"
        run: dotnet test StudentConnect.slnx --no-build --configuration Release
        working-directory: backend

  frontend:
    name: Frontend build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

      - name: Test
        run: npm test -- --watch=false
        working-directory: frontend

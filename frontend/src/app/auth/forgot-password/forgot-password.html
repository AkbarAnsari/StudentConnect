<section class="page page-narrow">
  <h1>Forgot password</h1>
  <p class="notice">Enter your username and we'll email you a link to reset your password.</p>

  @if (resultMessage()) {
    <p class="success-message">{{ resultMessage() }}</p>
  } @else {
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <label>
        Username
        <input type="text" formControlName="username" autocomplete="username" />
        @if (form.controls.username.invalid && form.controls.username.touched) {
          <span class="field-error">Username is required.</span>
        }
      </label>

      <button type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Sending...' : 'Send reset link' }}
      </button>
    </form>
  }

  <p class="notice"><a routerLink="/login">Back to login</a></p>
</section>

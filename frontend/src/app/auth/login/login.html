<section class="page page-narrow">
  <h1>Login</h1>
  <p class="notice">
    Development accounts only: student1/student2, teacher1, admin1 — password pattern
    <code>Role123!</code> (e.g. Student123!).
  </p>

  @if (errorMessage()) {
    <p class="error-message">{{ errorMessage() }}</p>
  }

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <label>
      Username
      <input type="text" formControlName="username" autocomplete="username" />
      @if (form.controls.username.invalid && form.controls.username.touched) {
        <span class="field-error">Username is required.</span>
      }
    </label>

    <label>
      Password
      <input type="password" formControlName="password" autocomplete="current-password" />
      @if (form.controls.password.invalid && form.controls.password.touched) {
        <span class="field-error">Password is required.</span>
      }
    </label>

    <button type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Logging in...' : 'Login' }}
    </button>
  </form>

  <p class="notice"><a routerLink="/forgot-password">Forgot your password?</a></p>
  <p class="notice">New school? <a routerLink="/register-school">Register your school here</a>.</p>
</section>

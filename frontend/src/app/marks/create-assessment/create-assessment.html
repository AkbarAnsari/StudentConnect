<section class="page page-narrow">
  <a class="back-link" routerLink="/assessments">Back to assessments</a>
  <header><p class="page-kicker">Gradebook</p><h1>Create assessment</h1><p>Save as Draft while entering marks, or publish immediately when results are ready.</p></header>

  @if (errorMessage()) {
    <p class="error-message">{{ errorMessage() }}</p>
  }

  <form [formGroup]="form" (ngSubmit)="onSubmit(false)">
    <label>
      Assigned class
      <select formControlName="assignmentId">
        <option [value]="0">Select a class</option>
        @for (assignment of assignments(); track assignment.id) {
          <option [value]="assignment.id">{{ assignment.subjectName }} / {{ assignment.gradeName }} - Section {{ assignment.sectionName }}</option>
        }
      </select>
      @if (form.controls.assignmentId.invalid && form.controls.assignmentId.touched) {
        <span class="field-error">Assigned class is required.</span>
      }
    </label>

    <label>
      Title
      <input type="text" formControlName="title" placeholder="e.g. Unit Test 2" />
      @if (form.controls.title.invalid && form.controls.title.touched) {
        <span class="field-error">Title is required.</span>
      }
    </label>

    <label>
      Type
      <select formControlName="assessmentType">
        @for (type of assessmentTypes; track type) {
          <option [value]="type">{{ type }}</option>
        }
      </select>
    </label>

    <label>
      Date
      <input type="date" formControlName="date" />
    </label>

    <label>
      Maximum marks
      <input type="number" formControlName="maximumMarks" min="1" />
      @if (form.controls.maximumMarks.invalid && form.controls.maximumMarks.touched) {
        <span class="field-error">Maximum marks must be greater than zero.</span>
      }
    </label>

    <label>
      Description
      <textarea formControlName="description" rows="3" placeholder="Optional context for staff"></textarea>
    </label>

    <label>
      Term (optional)
      <select formControlName="termId">
        <option [value]="0">No term</option>
        @for (term of terms(); track term.id) {
          <option [value]="term.id" [disabled]="term.isLocked">{{ term.name }} ({{ term.academicYearName }}){{ term.isLocked ? ' - locked' : '' }}</option>
        }
      </select>
    </label>

    <label>
      Weight (how much this counts toward the subject average; 1 = normal)
      <input type="number" formControlName="weight" min="0.1" step="0.1" />
      @if (form.controls.weight.invalid && form.controls.weight.touched) {
        <span class="field-error">Weight must be greater than zero.</span>
      }
    </label>

    <div class="form-actions"><button type="submit" class="btn btn-secondary" [disabled]="submitting()">{{ submitting() ? 'Saving...' : 'Save draft' }}</button><button type="button" [disabled]="submitting()" (click)="onSubmit(true)">Create and publish</button></div>
  </form>
</section>

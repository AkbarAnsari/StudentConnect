<div class="notification-bell">
  <button type="button" class="bell-toggle" (click)="toggleOpen()" aria-label="Notifications" aria-haspopup="dialog" [attr.aria-expanded]="open()" aria-controls="notification-popover">
    <ng-icon name="lucideBell" size="20" />
    @if (notificationService.unreadCount() > 0) {
      <span class="badge">{{ notificationService.unreadCount() }}</span>
    }
  </button>

  @if (open()) {
    <div id="notification-popover" class="notification-panel" role="dialog" aria-label="Recent notifications">
      <div class="notification-panel-header">
        <span>Notifications</span>
        @if (notificationService.unreadCount() > 0) {
          <button type="button" class="mark-all-btn" (click)="markAllAsRead()">Mark all read</button>
        }
      </div>

      <label class="digest-toggle">
        <input type="checkbox" [checked]="notificationService.digestEnabled()" (change)="toggleDigest($any($event.target).checked)" />
        Email me a periodic digest instead of one email per event
      </label>

      @if (notificationService.notifications().length === 0) {
        <p class="notification-empty">No notifications yet.</p>
      } @else {
        <div class="notification-list" role="list">
          @for (n of notificationService.notifications(); track n.id) {
            <button
              type="button"
              role="listitem"
              class="notification-item"
              [class.unread]="!n.isRead"
              [class.priority-important]="n.priority === 'Important'"
              [class.priority-urgent]="n.priority === 'Urgent'"
              (click)="openNotification(n)"
            >
              <strong>{{ n.title }}</strong>
              <p>{{ n.message }}</p>
              <span class="notification-time">{{ n.createdAtUtc | date: 'short' }}</span>
            </button>
          }
        </div>
      }
      <button type="button" class="view-all-btn" (click)="openCenter()">View all notifications</button>
    </div>
  }
</div>

<section class="page page-wide"><header><p class="page-kicker">Report governance</p><h1>Report administration</h1><p>Configure institutional presentation and issue finalized report batches.</p></header>@if(message()){<p class="success-message">{{message()}}</p>}@if(error()){<p class="error-message">{{error()}}</p>}<div class="report-admin-grid"><section><h2>Templates</h2><div class="template-form"><label>Name<input [ngModel]="form().name" (ngModelChange)="update('name',$event)" /></label><label>Header<input [ngModel]="form().headerText" (ngModelChange)="update('headerText',$event)" /></label><label>Footer<input [ngModel]="form().footerText" (ngModelChange)="update('footerText',$event)" /></label><label>Primary signature<input [ngModel]="form().primarySignatureLabel" (ngModelChange)="update('primarySignatureLabel',$event)" /></label><label>Secondary signature<input [ngModel]="form().secondarySignatureLabel" (ngModelChange)="update('secondarySignatureLabel',$event||null)" /></label><label><input type="checkbox" [ngModel]="form().isDefault" (ngModelChange)="update('isDefault',$event)" /> Default</label><button type="button" (click)="save()">Save template</button></div><div role="list">@for(template of templates();track template.id){<button type="button" role="listitem" class="template-row" (click)="edit(template)"><strong>{{template.name}}</strong><span>{{template.headerText}} · {{template.primarySignatureLabel}}</span></button>}</div></section><section><h2>Batch issuance</h2><div class="template-form"><label>Period<select [ngModel]="termId()" (ngModelChange)="termId.set(+$event)"><option [value]="0">Select period</option>@for(period of periods();track period.id){<option [value]="period.id">{{period.label}}</option>}</select></label><label>Grade<select [ngModel]="gradeId()" (ngModelChange)="gradeId.set(+$event)"><option [value]="0">All grades</option>@for(grade of grades();track grade.id){<option [value]="grade.id">{{grade.name}}</option>}</select></label><label>Template<select [ngModel]="templateId()" (ngModelChange)="templateId.set(+$event)"><option [value]="0">Default</option>@for(template of templates();track template.id){<option [value]="template.id">{{template.name}}</option>}</select></label><label>Comments<textarea [ngModel]="comments()" (ngModelChange)="comments.set($event)"></textarea></label><button type="button" (click)="issueBatch()">Issue batch</button></div></section></div></section>

<section class="page page-narrow">
  <a class="back-link" routerLink="/students">← Back to Students</a>
  <h1>Edit Student</h1>

  @if (errorMessage()) {
    <p class="error-message">{{ errorMessage() }}</p>
  }

  @if (student(); as s) {
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <label>
        Student ID
        <input type="text" [value]="s.studentId" disabled />
      </label>

      <label>
        First Name
        <input type="text" formControlName="firstName" />
        @if (form.controls.firstName.invalid && form.controls.firstName.touched) {
          <span class="field-error">First name is required.</span>
        }
      </label>

      <label>
        Last Name
        <input type="text" formControlName="lastName" />
        @if (form.controls.lastName.invalid && form.controls.lastName.touched) {
          <span class="field-error">Last name is required.</span>
        }
      </label>

      <label>
        Email
        <input type="email" formControlName="email" />
        @if (form.controls.email.invalid && form.controls.email.touched) {
          <span class="field-error">A valid email is required.</span>
        }
      </label>

      <label>
        Grade
        <select formControlName="gradeId">
          <option [value]="0">Select a grade</option>
          @for (grade of grades(); track grade.id) {
            <option [value]="grade.id">{{ grade.name }}</option>
          }
        </select>
        @if (form.controls.gradeId.invalid && form.controls.gradeId.touched) {
          <span class="field-error">Grade is required.</span>
        }
      </label>

      <label>
        Section
        <select formControlName="sectionId">
          <option [value]="0">Select a section</option>
          @for (section of sections(); track section.id) {
            <option [value]="section.id">{{ section.name }}</option>
          }
        </select>
        @if (form.controls.sectionId.invalid && form.controls.sectionId.touched) {
          <span class="field-error">Section is required.</span>
        }
      </label>

      <label>
        Date of birth (optional)
        <input type="date" formControlName="dateOfBirth" />
      </label>

      <label>
        Phone (optional)
        <input type="tel" formControlName="phone" />
      </label>

      <label>
        Address (optional)
        <input type="text" formControlName="address" />
      </label>

      <button type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Saving...' : 'Save Changes' }}
      </button>
    </form>

    <section class="panel">
      <h2>Enrollment Status</h2>
      @if (statusMessage()) {
        <p class="success-message">{{ statusMessage() }}</p>
      }
      @if (statusError()) {
        <p class="error-message">{{ statusError() }}</p>
      }
      <form [formGroup]="statusForm" (ngSubmit)="onStatusSubmit()">
        <label>
          Status
          <select formControlName="status">
            <option value="Active">Active</option>
            <option value="Withdrawn">Withdrawn</option>
            <option value="Graduated">Graduated</option>
            <option value="Transferred">Transferred</option>
          </select>
        </label>
        <label>
          Reason (required unless Active)
          <textarea formControlName="reason" rows="2"></textarea>
        </label>
        <button type="submit" [disabled]="statusSubmitting()">
          {{ statusSubmitting() ? 'Updating...' : 'Update Status' }}
        </button>
      </form>
    </section>
  } @else if (!errorMessage()) {
    <p class="loading">Loading student...</p>
  }
</section>
